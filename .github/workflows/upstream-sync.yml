name: Discover upstream changes

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch configured upstream branch
        shell: bash
        run: |
          git remote add upstream https://github.com/block/buzz.git
          git fetch --no-tags upstream main
      - name: Report capped upstream discovery
        shell: bash
        run: |
          python3 .upstream-intake/tools/upstream_intake.py discover \
            --repo . \
            --upstream-ref upstream/main \
            --format markdown >> "$GITHUB_STEP_SUMMARY"
