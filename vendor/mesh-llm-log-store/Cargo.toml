[package]
name = "mesh-llm-log-store"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.76.2"
description = "SQLite persistence for mesh-llm canonical logging pipeline"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"
keywords = ["llm", "mesh", "logging", "sqlite"]
categories = ["database-implementations"]

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
data-encoding = "2.6"
hex = "0.4"
mesh-llm-events = { version = "0.76.2", git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.2" }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "fallible_uint", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
